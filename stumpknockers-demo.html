<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stumpknockers</title>
<meta name="description" content="Stumpknockers, a family owned restaurant in Inverness, Florida.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,800;1,500&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--river:#0E3A42;--teal:#1B5560;--sand:#F4EBDD;--paper:#FBF6EC;--copper:#E08A4B;--glow:#F2A66C;--ink:#10262B;--wood:#8A5A2E}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:400 16px/1.65 'Hanken Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--sand);padding-bottom:74px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.05;letter-spacing:-.01em}
a{color:inherit}
:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
section{padding:64px 0}
h2{font-size:clamp(28px,6.2vw,52px);font-weight:800;margin-bottom:22px}
.btn{display:inline-block;font-size:15px;padding:12px 24px;border-radius:99px;background:var(--glow);color:var(--ink);font-weight:700;text-decoration:none;transition:transform .2s,box-shadow .2s;box-shadow:0 8px 22px rgba(224,138,75,.35)}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.55);box-shadow:none;backdrop-filter:blur(6px)}
.nav{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px;transition:background .3s}
.nav.solid{background:rgba(14,58,66,.93);backdrop-filter:blur(10px)}
.nav b{font:800 19px Fraunces,serif;color:#fff}
.nav nav{display:none;gap:26px}
.nav nav a{color:#fff;text-decoration:none;font-weight:500}
.nav .btn{padding:9px 20px;box-shadow:none}
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:var(--river);padding:0}
.sl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.4s}
.sl.on{opacity:1;animation:kb 9s ease-out forwards}
@keyframes kb{to{transform:scale(1.09)}}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(14,58,66,.35),rgba(10,40,46,.5) 45%,rgba(8,34,40,.92))}
.hero .in{position:relative;z-index:2;width:100%;max-width:1100px;margin:0 auto;padding:92px 24px 100px}
.chip{display:inline-flex;gap:8px;align-items:center;padding:8px 16px;border:1px solid rgba(255,255,255,.4);border-radius:99px;font-size:13px;white-space:nowrap;background:rgba(255,255,255,.1);backdrop-filter:blur(6px);margin-bottom:16px}
.hero h1{font-size:clamp(32px,9.8vw,120px);font-weight:800;overflow-wrap:normal;white-space:nowrap}
.hero p{font-size:16px;max-width:30ch;margin:14px 0 24px;color:#EAF3F2;line-height:1.5}
.hero .row .btn{padding:11px 18px;font-size:15px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.wave{position:absolute;bottom:-1px;left:0;width:100%;height:72px;z-index:2;display:block}
.pp{position:absolute;z-index:3;right:20px;top:68px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:99px;padding:6px 14px;font:500 14px 'Hanken Grotesk',sans-serif;cursor:pointer;backdrop-filter:blur(6px)}
.story{display:grid;gap:36px}
.story p{max-width:46ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stats div{background:var(--paper);border-radius:20px;padding:20px 12px;text-align:center;box-shadow:0 6px 18px rgba(16,38,43,.08)}
.stats b{display:block;font:800 clamp(22px,5.4vw,36px)/1.1 Fraunces,serif;color:var(--teal)}
.stats small{font-size:13px;color:#456}
.tick{background:var(--teal);color:#fff;overflow:hidden;white-space:nowrap;padding:16px 0;font:italic 500 19px Fraunces,serif}
.tick div{display:inline-block;animation:mq 34s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.paused .tick div,.paused .sl.on{animation-play-state:paused}
.favs{background:var(--paper)}
.fav{display:grid;gap:20px}
.card{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:4/5;color:#fff;background:var(--river);box-shadow:0 14px 34px rgba(16,38,43,.2)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover img{transform:scale(1.06)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(8,34,40,.92))}
.card div{position:absolute;z-index:2;left:22px;right:22px;bottom:20px}
.card h3{font-size:25px;font-weight:800}
.card p{font-size:14px;opacity:.9;margin:4px 0 10px}
.card span{display:inline-block;padding:4px 14px;border-radius:99px;background:var(--glow);color:var(--ink);font-weight:700;font-size:14px}
.menu{background:var(--river);color:var(--paper)}
.mi{display:flex;align-items:baseline;gap:12px;padding:20px 0;border-bottom:1px solid rgba(255,255,255,.18)}
.mi h3{font-size:21px;font-weight:500}
.mi i{flex:1;border-bottom:2px dotted rgba(255,255,255,.3);transform:translateY(-5px)}
.mi b{color:var(--glow);font-weight:700;white-space:nowrap}
.mi small{display:block;color:#BFD6D6;font-size:14px}
.revs{display:grid;gap:22px}
.rev{background:var(--paper);border-radius:26px;padding:34px 28px 28px;box-shadow:0 10px 28px rgba(16,38,43,.1)}
.rev::before{content:"\201C";display:block;font:800 84px/0.6 Fraunces,serif;color:var(--copper);height:34px}
.rev p{font:italic 500 20px/1.35 Fraunces,serif;margin-bottom:12px}
.rev cite{font-style:normal;color:#456;font-size:14px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;transition:transform .5s}
.gal img:first-child{grid-column:1/-1;aspect-ratio:16/10}
.gal img:hover{transform:scale(1.02)}
.visit{background:var(--teal);color:#fff}
.visit .box{display:grid;gap:30px}
address{font-style:normal;font-size:17px;margin-bottom:20px}
dl{display:grid;grid-template-columns:auto 1fr;gap:10px 22px}
dt{font-weight:700;color:var(--glow)}
footer{background:var(--river);color:#BFD6D6;padding:26px 0;font-size:14px}
.bar{position:fixed;inset:auto 0 0;z-index:20;display:flex;gap:10px;padding:10px 14px;background:rgba(14,58,66,.93);backdrop-filter:blur(10px)}
.bar .btn{flex:1;text-align:center;padding:12px 8px;box-shadow:none}
.js .rv{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s}
.js .rv.in{opacity:1;transform:none}
@media(min-width:760px){body{padding-bottom:0}.bar{display:none}.nav nav{display:flex}.story{grid-template-columns:1.1fr .9fr;align-items:center}.fav{grid-template-columns:repeat(3,1fr)}.revs{grid-template-columns:1fr 1fr}.gal{grid-template-columns:repeat(3,1fr)}.gal img:first-child{grid-column:auto;aspect-ratio:1}.visit .box{grid-template-columns:1fr 1fr}.menu .list{columns:2;column-gap:56px}.mi{break-inside:avoid}}
@media(prefers-reduced-motion:reduce){.sl.on,.tick div{animation:none}.js .rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style>
</head>

<script>
document.documentElement.classList.add('js');
const $=id=>document.getElementById(id),S=SITE;
document.title=S.name;
$('brand').textContent=$('foot').textContent=$('h1').textContent=S.name;
$('tag').textContent=S.tagline;$('about').textContent=S.about;$('addr').textContent=S.address;
$('chip').textContent='★ '+S.rating.score+' · '+S.rating.count.toLocaleString()+'+ Google reviews';
['c1','c2','c3','c4'].forEach(i=>$(i).href='tel:'+S.phone);
$('dir').href=$('dir2').href=S.mapsLink;
$('hrs').innerHTML=S.hours.map(h=>`<dt>${h[0]}</dt><dd>${h[1]}</dd>`).join('');
$('stats').innerHTML=`<div><b><span data-n="${S.rating.score}" data-d="1">${S.rating.score}</span></b><small>Google rating</small></div><div><b><span data-n="${S.rating.count}">${S.rating.count.toLocaleString()}</span>+</b><small>Google reviews</small></div><div><b>Family</b><small>owned</small></div>`;
const dishes=S.menu.map(m=>m[0]).join(' • ')+' • ';
$('tick').innerHTML=(dishes.repeat(4))+(dishes.repeat(4));
$('fav').innerHTML=S.favorites.map(f=>`<div class="card rv"><img src="${f[2]}" alt="" loading="lazy"><div><h3>${f[0]}</h3><p>${f[1]}</p><span>Ask for price</span></div></div>`).join('');
$('list').innerHTML=S.menu.map(m=>`<div class="mi rv"><h3>${m[0]}</h3><i></i><b>Ask for price</b></div>`).join('').replace(/<\/b><\/div>/g,'</b></div>');
$('revs').innerHTML=S.reviews.map(r=>`<blockquote class="rev rv"><p>${r[0]}</p><cite>${r[1]}</cite></blockquote>`).join('');
$('gal').innerHTML=S.gallery.map(u=>`<img src="${u}" alt="" loading="lazy">`).join('');
$('yr').textContent=new Date().getFullYear();$('credit').textContent=S.credit||'';
const sls=$('sls');
S.hero.forEach((u,i)=>{const d=document.createElement('div');d.className='sl'+(i?'':' on');d.style.backgroundImage=`url("${u}")`;sls.appendChild(d)});
let cur=0,t=null;
const go=()=>{const a=sls.children;a[cur].classList.remove('on');cur=(cur+1)%a.length;a[cur].classList.add('on')};
const setP=p=>{document.body.classList.toggle('paused',p);clearInterval(t);t=p?null:setInterval(go,6500);$('pp').textContent=p?'Play motion':'Pause motion'};
$('pp').onclick=()=>setP(!t);
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
setP(rm);
const nav=$('nav');const sc=()=>nav.classList.toggle('solid',scrollY>40);sc();addEventListener('scroll',sc,{passive:true});
const cnt=el=>{if(rm)return;const to=+el.dataset.n,d=+el.dataset.d||0,t0=performance.now();const f=n=>{const p=Math.min(1,(n-t0)/1400);el.textContent=(to*(1-Math.pow(1-p,3))).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');e.target.querySelectorAll&&e.target.querySelectorAll('[data-n]').forEach(cnt);io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
</script>
